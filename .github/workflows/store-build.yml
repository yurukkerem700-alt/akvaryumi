name: Store builds (Android AAB, iOS, Steam/Desktop)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
defaults: { run: { working-directory: store } }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: store/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Keystore (secret ayarlıysa)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - run: npm run android:aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: akvaryum-aab, path: store/android/app/build/outputs/bundle/release/*.aab }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run cap:sync
      - name: Simülatör derlemesi (imza gerektirmez; doğrulama)
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
      # App Store için: Apple Developer hesabı + sertifika/provisioning secret'ları ekleyip `xcodebuild archive` + `-exportArchive` adımlarını açın (store/README_STORE.md).
  desktop:
    strategy: { matrix: { os: [windows-latest, ubuntu-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run desktop:build
      - uses: actions/upload-artifact@v4
        with: { name: 'akvaryum-desktop-${{ matrix.os }}', path: store/dist-desktop }
